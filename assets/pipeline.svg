<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="Fraud risk pipeline shipped at apexanalytix: raw SQL Server logs, ETL in Python and SQL, Snowflake migrated to Apache Doris, 90-day behavioral features, ML model plus LLM classifier, and a 0 to 100 risk score served by FastAPI on Kubernetes that cut the review backlog 20%.">
<style>
  .t { font: 700 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #F0F6FC; }
  .s { font: 400 12.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8B949E; }
  .c { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  .h { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #8B949E; letter-spacing: .5px; }
  .node { opacity: 0; animation: up .5s ease-out forwards; }
  @keyframes up { to { opacity: 1; } }
  .flowline { stroke-dasharray: 6 9; animation: dash 1.2s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -15; } }
</style>
<defs>
  <filter id="soft" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <path id="flow" d="M150.0 124.0 L750.0 124.0 L750.0 300.0 L150.0 300.0"/>
</defs>
<rect x="1" y="1" width="898" height="398" rx="14" fill="#0D1117" stroke="#30363D"/>
<text x="30" y="42" class="h">// the fraud risk pipeline I shipped at apexanalytix</text>
<circle cx="748" cy="37" r="5" fill="#3FB950"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
<text x="762" y="42" class="h" fill="#3FB950" style="fill:#3FB950">in production</text>
<path d="M150.0 124.0 L750.0 124.0 L750.0 300.0 L150.0 300.0" class="flowline" fill="none" stroke="#58A6FF" stroke-opacity=".55" stroke-width="2"/>
<circle r="5" fill="#39D0D8" filter="url(#soft)"><animateMotion dur="7s" begin="0s" repeatCount="indefinite" rotate="auto"><mpath href="#flow"/></animateMotion></circle><circle r="5" fill="#58A6FF" filter="url(#soft)"><animateMotion dur="7s" begin="1.75s" repeatCount="indefinite" rotate="auto"><mpath href="#flow"/></animateMotion></circle><circle r="5" fill="#D2A8FF" filter="url(#soft)"><animateMotion dur="7s" begin="3.5s" repeatCount="indefinite" rotate="auto"><mpath href="#flow"/></animateMotion></circle><circle r="5" fill="#3FB950" filter="url(#soft)"><animateMotion dur="7s" begin="5.25s" repeatCount="indefinite" rotate="auto"><mpath href="#flow"/></animateMotion></circle>
<g class="node" style="animation-delay:0.15s">
  <rect x="30" y="72" width="240" height="104" rx="11" fill="#161B22" stroke="#30363D"/>
  <rect x="30" y="84" width="3" height="80" rx="1.5" fill="#FFA657"/>
  <text x="48" y="98" class="t">Raw sources</text>
  <text x="48" y="119" class="s">SQL Server event, audit</text>
  <text x="48" y="136" class="s">and banking logs</text>
  <rect x="48" y="147" width="175" height="20" rx="10" fill="#FFA657" fill-opacity=".14" stroke="#FFA657" stroke-opacity=".5"/>
  <text x="58" y="161" class="c" fill="#FFA657">dupes · nulls · drift</text>
</g><g class="node" style="animation-delay:0.33s">
  <rect x="330" y="72" width="240" height="104" rx="11" fill="#161B22" stroke="#30363D"/>
  <rect x="330" y="84" width="3" height="80" rx="1.5" fill="#39D0D8"/>
  <text x="348" y="98" class="t">ETL in Python + SQL</text>
  <text x="348" y="119" class="s">continuous ingestion,</text>
  <text x="348" y="136" class="s">source-to-target checks</text>
  <rect x="348" y="147" width="94" height="20" rx="10" fill="#39D0D8" fill-opacity=".14" stroke="#39D0D8" stroke-opacity=".5"/>
  <text x="358" y="161" class="c" fill="#39D0D8">30% faster</text>
</g><g class="node" style="animation-delay:0.51s">
  <rect x="630" y="72" width="240" height="104" rx="11" fill="#161B22" stroke="#30363D"/>
  <rect x="630" y="84" width="3" height="80" rx="1.5" fill="#58A6FF"/>
  <text x="648" y="98" class="t">Warehouse</text>
  <text x="648" y="119" class="s">Snowflake (OLAP + OLTP)</text>
  <text x="648" y="136" class="s">migrated to Apache Doris</text>
  <rect x="648" y="147" width="138" height="20" rx="10" fill="#58A6FF" fill-opacity=".14" stroke="#58A6FF" stroke-opacity=".5"/>
  <text x="658" y="161" class="c" fill="#58A6FF">+12% usable data</text>
</g><g class="node" style="animation-delay:0.69s">
  <rect x="630" y="248" width="240" height="104" rx="11" fill="#161B22" stroke="#30363D"/>
  <rect x="630" y="260" width="3" height="80" rx="1.5" fill="#D2A8FF"/>
  <text x="648" y="274" class="t">Behavioral features</text>
  <text x="648" y="295" class="s">90-day windows: logins,</text>
  <text x="648" y="312" class="s">velocity, device/IP shifts</text>
  <rect x="648" y="323" width="131" height="20" rx="10" fill="#D2A8FF" fill-opacity=".14" stroke="#D2A8FF" stroke-opacity=".5"/>
  <text x="658" y="337" class="c" fill="#D2A8FF">anomaly signals</text>
</g><g class="node" style="animation-delay:0.87s">
  <rect x="330" y="248" width="240" height="104" rx="11" fill="#161B22" stroke="#30363D"/>
  <rect x="330" y="260" width="3" height="80" rx="1.5" fill="#D2A8FF"/>
  <text x="348" y="274" class="t">ML model + LLM</text>
  <text x="348" y="295" class="s">thresholds tuned on</text>
  <text x="348" y="312" class="s">precision, recall, F1</text>
  <rect x="348" y="323" width="168" height="20" rx="10" fill="#D2A8FF" fill-opacity=".14" stroke="#D2A8FF" stroke-opacity=".5"/>
  <text x="358" y="337" class="c" fill="#D2A8FF">-15% FP · +5% recall</text>
</g><g class="node" style="animation-delay:1.05s"><rect x="26" y="244" width="248" height="112" rx="14" fill="none" stroke="#3FB950" stroke-width="2"><animate attributeName="opacity" values="0;.9;0" dur="2.4s" repeatCount="indefinite"/></rect>
  <rect x="30" y="248" width="240" height="104" rx="11" fill="#161B22" stroke="#30363D"/>
  <rect x="30" y="260" width="3" height="80" rx="1.5" fill="#3FB950"/>
  <text x="48" y="274" class="t">Risk score 0-100</text>
  <text x="48" y="295" class="s">FastAPI · Docker · K8s</text>
  <text x="48" y="312" class="s">shipped through CI/CD</text>
  <rect x="48" y="323" width="161" height="20" rx="10" fill="#3FB950" fill-opacity=".14" stroke="#3FB950" stroke-opacity=".5"/>
  <text x="58" y="337" class="c" fill="#3FB950">-20% review backlog</text>
</g>
</svg>