<svg xmlns="http://www.w3.org/2000/svg" width="440" height="190" viewBox="0 0 440 190" role="img" aria-label="Little Helper benchmarks: on-device inference latency cut from 14 ms to 3.1 ms, streaming throughput raised from 0.5 to 4 FPS.">
<style>
  .l { font: 600 12.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #C9D1D9; }
  .v { font: 600 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
</style>
<rect x="1" y="1" width="438" height="188" rx="12" fill="#0D1117" stroke="#30363D"/>

<text x="24" y="36" class="l">On-device inference latency (Core ML)</text>
<rect x="24" y="46" width="392.0" height="16" rx="8" fill="#30363D"/>
<rect x="24" y="46" width="392.0" height="16" rx="8" fill="#3FB950">
  <animate attributeName="width" values="392.0;392.0;86.8;86.8" keyTimes="0;.15;.55;1" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1"/>
</rect>
<text x="24" y="82" class="v"><tspan fill="#8B949E">14 ms</tspan><tspan fill="#8B949E"> → </tspan><tspan fill="#3FB950" font-weight="700">3.1 ms · 4.5x faster</tspan></text>

<text x="24" y="114" class="l">Peer-to-peer WebRTC streaming</text>
<rect x="24" y="124" width="392.0" height="16" rx="8" fill="#30363D"/>
<rect x="24" y="124" width="49.0" height="16" rx="8" fill="#39D0D8">
  <animate attributeName="width" values="49.0;49.0;392.0;392.0" keyTimes="0;.15;.55;1" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1"/>
</rect>
<text x="24" y="160" class="v"><tspan fill="#8B949E">0.5 FPS</tspan><tspan fill="#8B949E"> → </tspan><tspan fill="#39D0D8" font-weight="700">4 FPS · 8x</tspan></text>
</svg>